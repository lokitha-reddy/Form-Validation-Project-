<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Project</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-lg">
                    <div class="card-header bg-primary text-white text-center">
                        <h2 class="mb-0">Registration Form</h2>
                        <p class="mb-0 mt-2">Please fill out all required fields</p>
                    </div>
                    
                    <div class="card-body p-4">
                        <form id="registrationForm" novalidate>
                            <!-- Full Name Field -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label">
                                    Full Name <span class="text-danger">*</span>
                                </label>
                                <input 
                                    type="text" 
                                    class="form-control" 
                                    id="fullName" 
                                    name="fullName"
                                    placeholder="Enter your full name"
                                    aria-describedby="fullNameError"
                                    required
                                >
                                <div id="fullNameError" class="error-message" role="alert"></div>
                            </div>

                            <!-- Email Field -->
                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address <span class="text-danger">*</span>
                                </label>
                                <input 
                                    type="email" 
                                    class="form-control" 
                                    id="email" 
                                    name="email"
                                    placeholder="Enter your email address"
                                    aria-describedby="emailError"
                                    required
                                >
                                <div id="emailError" class="error-message" role="alert"></div>
                            </div>

                            <!-- Phone Number Field -->
                            <div class="mb-3">
                                <label for="phone" class="form-label">
                                    Phone Number <span class="text-danger">*</span>
                                </label>
                                <input 
                                    type="tel" 
                                    class="form-control" 
                                    id="phone" 
                                    name="phone"
                                    placeholder="Enter 10-digit phone number"
                                    aria-describedby="phoneError"
                                    maxlength="10"
                                    required
                                >
                                <div id="phoneError" class="error-message" role="alert"></div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password <span class="text-danger">*</span>
                                </label>
                                <div class="position-relative">
                                    <input 
                                        type="password" 
                                        class="form-control" 
                                        id="password" 
                                        name="password"
                                        placeholder="Enter a strong password"
                                        aria-describedby="passwordError"
                                        required
                                    >
                                    <button 
                                        type="button" 
                                        class="btn btn-link position-absolute end-0 top-0 password-toggle"
                                        data-target="password"
                                        aria-label="Toggle password visibility"
                                    >
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <div id="passwordError" class="error-message" role="alert"></div>
                                <div class="password-requirements mt-1">
                                    <small class="text-muted">
                                        Password must be at least 8 characters, not "password", and not your name
                                    </small>
                                </div>
                            </div>

                            <!-- Confirm Password Field -->
                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label">
                                    Confirm Password <span class="text-danger">*</span>
                                </label>
                                <div class="position-relative">
                                    <input 
                                        type="password" 
                                        class="form-control" 
                                        id="confirmPassword" 
                                        name="confirmPassword"
                                        placeholder="Confirm your password"
                                        aria-describedby="confirmPasswordError"
                                        required
                                    >
                                    <button 
                                        type="button" 
                                        class="btn btn-link position-absolute end-0 top-0 password-toggle"
                                        data-target="confirmPassword"
                                        aria-label="Toggle confirm password visibility"
                                    >
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                                <div id="confirmPasswordError" class="error-message" role="alert"></div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Register
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Success Message -->
                <div id="successMessage" class="alert alert-success mt-3 d-none" role="alert">
                    <h4 class="alert-heading">Registration Successful!</h4>
                    <p class="mb-0">Your account has been created successfully. Welcome aboard!</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    
    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
